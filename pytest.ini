[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, no external services)
    integration: Integration tests (may access external services)
    slow: Slow tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
log_cli = True
log_cli_level = INFO 